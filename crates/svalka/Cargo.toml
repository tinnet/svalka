[package]
name = "svalka"
description = "Fan control for Linux: temperatures in, PWM out, via piecewise-linear curves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
svalka-core = { version = "0.1.0", path = "../svalka-core" }
rustix = { version = "1.1.5", features = ["time"] }
shadow-rs = "1.7"
signal-hook = "0.4.5"

[build-dependencies]
shadow-rs = "1.7"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3"

[lints]
workspace = true
