# Example svalka config: two fans on an nct6798 Super-I/O, one following
# the CPU (k10temp), one following the GPU hotspot (amdgpu).
#
# Install as /etc/svalka.toml, then check it against your hardware:
#   svalka --config /etc/svalka.toml check
# `svalka status` lists the chips, labels and outputs you can use here.

interval = "1s"           # control loop period
# How often the fan outputs are read back (mode, duty, rpm) to notice a stalled
# fan or another program taking an output over. Duties are still written every
# interval. On some ASUS boards each read of the nct6798 costs ~84 ms of CPU
# (the driver goes through ACPI WMI), so reading it every second costs ~4 % of
# a core.
readback_interval = "10s"
failsafe_duty = 100       # % used when any input sensor fails to read

# Temperature inputs, named once. `chip` is the hwmon driver name; add
# `path = "..."` (the end of the device path) if two chips share a name.
# `label` is the input's label as `svalka status` shows it.
[sensors]
cpu = { chip = "k10temp", label = "Tctl" }
gpu = { chip = "amdgpu",  label = "junction" }   # read-only; the GPU fan stays on its firmware curve

[fan.cpu_cooler]
output     = { chip = "nct6798", pwm = 2 }   # `svalka identify cpu_cooler` shows which fan this is
sources    = ["cpu"]           # several sources: the hottest one wins
curve      = [[35, 30], [55, 55], [75, 90], [85, 100]]   # [°C, %]
smoothing  = "8s"              # EMA window on the input temperature
hysteresis = 2.0               # °C the temperature must fall before duty drops
min_duty   = 20                # % floor: this fan never stops

[fan.exhaust]
output     = { chip = "nct6798", pwm = 1 }
sources    = ["gpu"]
# Quiet while the GPU runs cool (~45–55 % at a 65–70 °C hotspot), full speed
# by 90 °C.
curve      = [[40, 30], [60, 40], [75, 60], [90, 100]]
smoothing  = "8s"
hysteresis = 2.0
